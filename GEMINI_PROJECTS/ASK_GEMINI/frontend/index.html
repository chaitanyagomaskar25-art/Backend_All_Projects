<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ask Gemini</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
      <h1>Gemini AI Interface</h1>
      <p>
        Ask questions, analyze concepts, or generate code. Powered by Gemini API.
      </p>
    <form id="questionForm">
      <textarea id="question" placeholder="Write question here"></textarea>
      <button type="submit" id="submitBtn">Ask gemini</button>
    </form>
    <div>
      <h2>Answer</h2>
      <div id="answer">Your Answer will appear here...</div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="script.js"></script>
  </body>
</html>
